<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LLM Deep Dive: a step-by-step companion</title>
  <meta name="description" content="A step-by-step, interactive study companion to Andrej Karpathy's lecture Deep Dive into LLMs like ChatGPT: pretraining, tokenization, SFT, reinforcement learning, RLHF and more.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAFBFD" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121726" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="LLM Deep Dive: a step-by-step companion">
  <meta property="og:description" content="Fifteen interactive steps through Andrej Karpathy's lecture on how ChatGPT-style models are built and how to use them well.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('llm-deep-dive:v1') || 'null');
        if (s && (s.theme === 'dark' || s.theme === 'light')) document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="rail" aria-label="Tutorial navigation">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-text"><strong>LLM Deep Dive</strong><span>A companion to Karpathy's lecture</span></span>
      </a>
      <nav id="rail-nav" aria-label="Steps"></nav>
    </aside>

    <div class="page">
      <header class="topbar">
        <div class="topbar-row">
          <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-haspopup="dialog" aria-controls="sheet">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
            <span>Steps</span>
          </button>
          <a class="brand brand-top" href="#/">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <strong>LLM Deep Dive</strong>
          </a>
          <button id="theme-btn" class="icon-btn" type="button" aria-pressed="false" aria-label="Switch to dark theme">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
            <span class="theme-label">Dark</span>
          </button>
        </div>
        <div class="strip-wrap">
          <nav id="strip" class="strip" aria-label="Progress by step"></nav>
          <p id="strip-label" class="strip-label"></p>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>

      <footer class="foot">
        <p>Unofficial study notes for <a href="https://www.youtube.com/watch?v=7xTGNNLPyMI" target="_blank" rel="noopener">Deep Dive into LLMs like ChatGPT</a> by Andrej Karpathy, written for learning and not affiliated with the lecturer. <a href="../">More AI learning notes</a></p>
      </footer>
    </div>
  </div>

  <dialog id="sheet" class="sheet" aria-label="Tutorial steps">
    <div class="sheet-head">
      <strong>Steps</strong>
      <button id="sheet-close" class="btn small secondary" type="button">Close</button>
    </div>
    <nav id="sheet-nav" aria-label="Steps"></nav>
  </dialog>

  <noscript><p class="noscript">This tutorial needs JavaScript for its navigation and demos.</p></noscript>
  <script src="js/content.js"></script>
  <script src="js/demos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
